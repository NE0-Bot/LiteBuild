<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign In</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;}

            body {
                background-color: #ecf8fa;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;}

            .login {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                gap: 60px;
                padding: 40px 20px;
                width: 100%;
                max-width: 800px;}

            .logo {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;}

            .logo img {
                width: 180px;
                height: auto;
                margin-bottom: 16px;}

            .logo h1 {
                font-size: 2rem;
                margin: 0;
            }

            .logo h3 {
                font-weight: normal;
                color: #555;
                margin-top: 4px;
            }

            .login-form {
                background: #fff;
                padding: 40px 36px;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 340px;}

            .login-form h2 {
                margin-bottom: 24px;
                font-size: 1.4rem;
                color: #333;
                text-align: center;}

            .login-form label {
                display: block;
                margin-bottom: 6px;
                font-size: 0.9rem;
                color: #555;}

            .login-form input[type="text"],
            .login-form input[type="password"] {
                width: 100%;
                padding: 12px 14px;
                margin-bottom: 18px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 1rem;
                outline: none;
                transition: border-color 0.2s;}

            .login-form input:focus {
                border-color: #1a73e8;}

            .login-form button {
                width: 100%;
                padding: 12px;
                background-color: #1a73e8;
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: 1.1rem;
                font-weight: bold;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            .login-form button:hover {
                background-color: #155ab6;
            }

            .login-form .extras {
                display: flex;
                justify-content: space-between;
                margin-top: 14px;
                font-size: 0.85rem;
            }

            .login-form .extras a {
                color: #1a73e8;
                text-decoration: none;
            }

            .login-form .extras a:hover {
                text-decoration: underline;
            }

            /* ===== RESPONSIVE ===== */
            @media (max-width: 600px) {
                .login {
                    gap: 30px;
                    padding: 30px 16px;
                }

                .logo img {
                    width: 120px;
                }

                .logo h1 {
                    font-size: 1.5rem;
                }

                .login-form {
                    padding: 28px 24px;
                }
            }
        </style>
    </head>
    <body>

        <div class="login">

            <div class="logo">
                <img src="logo.png" alt="LiteBuild Logo">
                <h1>LiteBuild</h1>
                <h3>by LiteHost</h3>
            </div>

            <!-- Login form – center right -->
            <div class="login-form">
                <h2>Sign In</h2>

                <form action="shop.html" method="get">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username">

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">

                    <button type="submit">Log In</button>
                </form>

                </div>
            </div>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LiteBuild</title>
        <link rel="stylesheet" href="header.css">

        <style>
            body {
                background-color: #ecf8fa;
                margin: 0;}
            .start {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 80vh;
                text-align: center;
            }
            .start img {
                max-width: 200px;
                margin-bottom: 20px;}
            .start h1 {
                margin: 0 0 5px;
                font-size: 2.5rem;}
            .start h3 {
                margin: 0 0 30px;
                font-weight: normal;
                color: #555;}
            .btn {
                display: inline-block;
                padding: 14px 40px;
                background-color: #1a73e8;
                color: #fff;
                text-decoration: none;
                font-size: 1.2rem;
                font-weight: bold;
                border-radius: 8px;
                transition: background-color 0.2s;}
            .btn:hover {
                background-color: #155ab6;}
        </style>
        
    </head>

    <body>
        <div class="start">
            <img src="logo.png" alt="LiteBuild Logo">
            <h1>LiteBuild</h1>
            <h3>by LiteHost</h3>
            <a href="index.html" class="btn">Get Started</a>
        </div>
    </body>
</html>
